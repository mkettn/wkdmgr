name: Build & Test

# Compile/test gate only -- no lint or format checks (see code-review.yml,
# if/when one exists, for those). The point is narrow: catch a dependency
# bump (Dependabot, or anyone else's Cargo.lock/package-lock.json change)
# that no longer builds or passes the existing test suite, nothing more.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # frontend's build regenerates its OpenAPI-derived types by running
      # the wkdmgr-mgmt binary (see package.json's prebuild script), so
      # this job needs Rust too, not just Node.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
